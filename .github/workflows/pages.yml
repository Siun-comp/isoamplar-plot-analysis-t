name: Verify and Deploy Prebuilt Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && vars.ISOAMPLAR_APPROVED_RELEASE_SHA == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact public tree and Git object bytes
        run: node verify-artifacts.mjs --root . --git-ref "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && vars.ISOAMPLAR_APPROVED_RELEASE_SHA == github.sha
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recheck exact candidate
        run: node verify-artifacts.mjs --root . --git-ref "$GITHUB_SHA"
      - name: Read fresh public main and release-control P+D approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node verify-artifacts.mjs --approval --root .
      - uses: actions/deploy-pages@v4
        id: deployment
